	#Double-jump enchantment settings.
	[enchantments.doublejump]
		#Vertical boost applied by double jump.
		# Default: 0.8
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		doublejumpforce = 0.8
		#Keep vertical momentum when double jumping.
		doublejump_relative_to_falling = false
