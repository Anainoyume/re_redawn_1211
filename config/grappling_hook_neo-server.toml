		#Maximum wallrun duration in seconds.
		# Default: 3.0
		# Range: 0.0 ~ 1.7976931348623157E308
		max_wallrun_time = 3.0
		#Wallrun acceleration.
		# Default: 0.1
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		wallrun_speed = 0.1
		#Maximum wallrun speed.
		# Default: 0.7
		# Range: 0.0 ~ 1.7976931348623157E308
