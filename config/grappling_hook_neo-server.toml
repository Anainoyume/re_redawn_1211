				max_upgraded = 30.0
				#Minimum value in the grappling hook modifier before the limits upgrade.
				# Default: 15.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				min = 15.0
				#Minimum value in the grappling hook modifier after the limits upgrade.
				# Default: 1.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				min_upgraded = 1.0

			[grapplinghook.custom.rocket.rocket_vertical_angle]
				#Value used when creating a new non-modified grappling hook.
				# Default: 0.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				default_value = 0.0
				#Whether this value can be changed in the grappling hook modifier: 0 = always enabled, 1 = enabled after limits upgrade, 2 = always disabled.
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0
				#Maximum value in the grappling hook modifier before the limits upgrade.
				# Default: 90.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				max = 90.0
				#Maximum value in the grappling hook modifier after the limits upgrade.
				# Default: 90.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				max_upgraded = 90.0
				#Minimum value in the grappling hook modifier before the limits upgrade.
				# Default: 0.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				min = 0.0
				#Minimum value in the grappling hook modifier after the limits upgrade.
				# Default: 0.0
				# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
				min_upgraded = 0.0

	#Block filtering for grapple attach and break behavior.
	[grapplinghook.blocks]
		#Whitelist of blocks the hook can attach to (comma-separated IDs, or 'any').
		grapplingBlocks = "any"
		#Blacklist of blocks the hook cannot attach to (comma-separated IDs, or 'none').
		grapplingNonBlocks = "none"
		#Blocks the hook should break when hit (comma-separated IDs, or 'none').
		grappleBreakBlocks = "none"

	#General grappling hook tuning values.
	[grapplinghook.other]
		#If true, hooks can affect entities.
		hookaffectsentities = true
		#Extra allowed rope stretch before snapping.
		# Default: 5.0
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		rope_snap_buffer = 5.0
		#Default grappling hook durability.
		# Default: 500
		# Range: > 1
		default_durability = 500
		#Maximum jump speed when jumping off rope.
		# Default: 1.0
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		rope_jump_power = 1.0
		#Jump in rope direction instead of straight up.
		rope_jump_at_angle = false
		#Cooldown in seconds between rope jumps.
		# Default: 0.0
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		rope_jump_cooldown_s = 0.0
		#Rope climb speed.
		# Default: 0.3
		# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		climb_speed = 0.3

#Long fall boots options.
[longfallboots]
	#Allow crafting long fall boots in the modifier block.
	longfallbootsrecipe = true

#Ender staff tuning.
[enderstaff]
	#Launch strength of the ender staff.
	# Default: 1.5
	# Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
	ender_staff_strength = 1.5
	#Recharge time for ender staff in ticks.
	# Default: 100
	# Range: > 0
	ender_staff_recharge = 100

